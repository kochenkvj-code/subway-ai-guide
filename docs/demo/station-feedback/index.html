<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>역 개선 의견 · 화면 데모</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eef5;color:#19324f;font-family:system-ui,-apple-system,'Noto Sans CJK KR',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8cb6df;outline-offset:2px}.demo{max-width:440px;margin:18px auto 8px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11px;color:#637994}.demo select{border:1px solid #ced8e5;background:white;border-radius:8px;padding:7px;color:#19324f;font-size:12px}.phone{max-width:440px;min-height:780px;margin:10px auto 30px;background:#f4f6f9;border-radius:24px;overflow:hidden;box-shadow:0 12px 45px #192f4b0c}header{display:flex;align-items:center;padding:16px;background:white;border-bottom:1px solid #e1e7ef;gap:12px}header button{border:0;background:none;color:#19324f;font-size:21px;width:32px;height:36px}header h1{font-size:17px;margin:0;flex:1}header span{font-size:11px;color:#69809c}main{padding:22px 20px}.station{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#637b98;margin-bottom:20px}.line{display:grid;place-items:center;background:#24559b;color:white;width:19px;height:19px;border-radius:50%;font-size:11px}h2{font-size:23px;line-height:1.45;margin:0 0 10px;letter-spacing:-.8px}p{font-size:13px;line-height:1.8;color:#70839b;margin:0 0 20px}.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #dfe6ee;border-radius:16px;background:white;padding:20px 16px;margin:12px 0;color:#19324f}.choice:first-of-type{border-color:#cddfcf}.icon{position:relative;border-radius:13px;width:46px;height:46px;display:grid;place-items:center;background:#eaf2e7;color:#4c785b;font-size:23px}.choice:nth-of-type(2) .icon{background:#eaf0fa;color:#4f72a3}.choice strong{display:block;font-size:16px;margin-bottom:5px}.choice small{color:#7b8da3;font-size:12px}.arrow{margin-left:auto;color:#93a4b8}.note{font-size:11px;color:#8392a5;line-height:1.8;margin-top:22px}.badge{position:absolute;right:-5px;top:-5px;background:#42678e;border:2px solid #fff;border-radius:20px;color:white;min-width:21px;height:21px;display:grid;place-items:center;font-size:10px}.preview{border:1px dashed #ccd6e3;border-radius:12px;padding:13px;margin-top:34px;display:flex;align-items:center;gap:14px;font-size:12px;color:#7b8da3}.preview .icon{width:36px;height:36px;font-size:18px}.preview strong{color:#46627f;font-size:12px;display:block;margin-bottom:4px}label{display:block;font-size:13px;font-weight:650;margin:18px 0 9px}label small{font-weight:400;color:#8997a9}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{border:1px solid #dce4ed;border-radius:9px;background:white;color:#5b718e;padding:10px 12px;font-size:12px;min-height:40px}.chips button[aria-pressed=true]{border-color:#365d88;background:#eaf0f8;color:#244c7b;font-weight:650}select.field,textarea{width:100%;border:1px solid #dce4ed;border-radius:12px;background:white;color:#19324f;padding:13px;font-size:14px}textarea{height:135px;resize:vertical;line-height:1.7}textarea::placeholder{color:#9aa8ba}.counter{text-align:right;font-size:11px;color:#899ab0;margin-top:6px}.primary,.secondary{border:0;border-radius:12px;padding:14px;width:100%;background:#203d61;color:white;font-weight:650;font-size:14px;min-height:48px}.secondary{background:white;border:1px solid #dce4ed;color:#58718e;margin-top:10px}.smallnote{font-size:11px;color:#8090a6;line-height:1.7;margin:10px 0 20px}.success{text-align:center;padding:60px 5px}.check{margin:0 auto 22px;border-radius:50%;width:64px;height:64px;background:#e5efdf;color:#54774b;display:grid;place-items:center;font-size:30px}.success h2{font-size:21px}.summary{background:white;border:1px solid #dfe6ee;border-radius:15px;padding:16px;margin:0 0 20px;display:flex;align-items:baseline;gap:8px}.summary b{font-size:29px;color:#284e7a}.summary span{font-size:12px;color:#7890a8}.filters{display:flex;gap:8px;align-items:center;margin-bottom:14px}.filters select{min-width:0;flex:1;padding:10px;border:1px solid #dce4ed;border-radius:10px;background:white;color:#456383;font-size:12px}.filters button{font-size:12px;border:1px solid #dce4ed;border-radius:10px;background:white;color:#5c7490;padding:10px}.filters button[aria-pressed=true]{color:#8a6928;border-color:#d9c899;background:#fff9eb}.opinion{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:16px;margin-bottom:10px}.meta{display:flex;align-items:center;gap:6px;font-size:10px;color:#8b9aae}.tag{font-size:10px;background:#eef3f9;color:#547291;padding:4px 6px;border-radius:5px}.star{border:0;background:none;color:#a8b5c5;font-size:24px;margin-left:auto;min-height:36px;min-width:36px}.star[aria-pressed=true]{color:#b58a36}.opinion p{font-size:14px;line-height:1.8;color:#354e6b;margin:8px 0 5px;white-space:pre-wrap;overflow-wrap:anywhere}.opinion small{font-size:11px;color:#91a0b1}.pager{display:flex;justify-content:center;gap:18px;align-items:center;margin:20px;color:#8b9bb0;font-size:12px}.pager button{border:1px solid #dce4ed;background:white;border-radius:8px;padding:8px;color:#7189a2}.demo-notice{font-size:10px;text-align:center;margin-top:24px;color:#97a4b5}.empty{padding:35px 0;text-align:center;color:#7b8da3}@media(max-width:480px){body{background:#f4f6f9}.phone{margin:0;max-width:none;border-radius:0;box-shadow:none;min-height:calc(100dvh - 56px)}.demo{margin:8px auto}.phone header{padding:12px 16px}}
</style><div class="demo"><span>화면 데모 · 실제 저장 없음</span><select id="screens" aria-label="데모 화면 선택"><option value="entry">메뉴 진입</option><option value="write">의견 작성</option><option value="done">등록 완료</option><option value="inbox">직원 의견함</option></select></div><div class="phone"><header><button id="back" aria-label="뒤로">‹</button><h1>역 개선 의견</h1><span>한국어</span></header><main id="app"></main></div>
<script>
const $=s=>document.querySelector(s);let screen=new URLSearchParams(location.search).get('screen')||'entry',category='시설·장비',filter='전체 유형',onlyStar=false,draft='',place='';let items=[{id:1,type:'안내·표지판',place:'출구',text:'출구 번호 안내가 갈림길 전에 한 번 더 있으면 처음 오는 사람도 찾기 편할 것 같아요.',time:'11. 01. 14:32',star:true},{id:2,type:'이용 편의',place:'승강장',text:'승강장 의자가 있는 위치를 안내도에 표시해 주시면 좋겠습니다.',time:'11. 01. 11:08',star:false},{id:3,type:'개선 아이디어',place:'개찰구',text:'외국인도 QR 안내를 쉽게 찾을 수 있도록 작은 안내 표시가 있으면 좋겠어요.',time:'10. 31. 18:45',star:false}];let total=7;const types=['시설·장비','안내·표지판','청결·환경','이용 편의','개선 아이디어','기타'];const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const station='<div class="station"><span class="line">1</span>종로5가역</div>';function go(s){screen=s;render();window.scrollTo(0,0)}
function render(){ $('#screens').value=screen;let html=station;
if(screen==='entry')html+='<h2>더 편리한 역을 위한<br>작은 생각을 남겨주세요.</h2><p>역 이용 중 떠오른 개선점과 아이디어를<br>직원들이 참고할 수 있도록 모읍니다.</p><button class="choice" onclick="go(\'write\')"><span class="icon">✎</span><span><strong>의견 남기기</strong><small>불편했던 점이나 새로운 아이디어</small></span><span class="arrow">›</span></button><button class="choice" onclick="go(\'inbox\')"><span class="icon">▤</span><span><strong>의견함 보기</strong><small>직원 참고용 · 데모에서는 바로 열립니다</small></span><span class="arrow">›</span></button><div class="note">의견은 역사 운영과 이용환경 개선에 참고합니다.<br>개별 답변이나 조치 결과는 제공하지 않습니다.</div><div class="preview"><span class="icon">✎<span class="badge">'+total+'</span></span><span><strong>메인 메뉴 배지 예시</strong>최근 30일 의견 '+total+'건 · 예시 데이터</span></div>';
if(screen==='write')html+='<h2>의견 남기기</h2><p>역사 이용 중 느낀 불편한 점이나<br>개선 아이디어를 자유롭게 남겨주세요.</p><form id="form"><label>의견 유형</label><div class="chips">'+types.map(t=>'<button type="button" aria-pressed="'+(category===t)+'" onclick="choose(\''+t+'\')">'+t+'</button>').join('')+'</div><label for="place">위치 <small>선택 사항</small></label><select class="field" id="place"><option value="">위치를 선택해 주세요</option>'+['개찰구','승강장','화장실','출구','기타'].map(x=>'<option '+(place===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label for="content">개선 의견</label><textarea id="content" required maxlength="500" placeholder="어떤 점이 더 좋아지면 좋을까요?">'+esc(draft)+'</textarea><div class="counter"><span id="count">'+draft.length+'</span> / 500</div><div class="smallnote">이름·연락처 등 개인정보는 적지 마세요.<br>의견은 직원 참고용이며 개별 답변이나 조치 결과는 제공되지 않습니다.</div><button class="primary">의견 남기기</button></form>';
if(screen==='done')html+='<div class="success"><div class="check">✓</div><h2>의견을 남겨주셔서<br>감사합니다.</h2><p>더 편리한 역을 위한 참고자료로 활용합니다.<br>개별 답변이나 조치 결과는 제공되지 않습니다.</p><button class="primary" onclick="go(\'entry\')">돌아가기</button><button class="secondary" onclick="go(\'inbox\')">데모 의견함 확인</button></div>';
if(screen==='inbox'){let list=items.filter(x=>(filter==='전체 유형'||x.type===filter)&&(!onlyStar||x.star));html+='<h2>의견함</h2><p>역 개선에 참고할 의견을 확인해 보세요.</p><div class="summary"><span>최근 30일</span><b>'+total+'</b><span>건 · 이 역의 전체 의견</span></div><div class="filters"><select id="filter" aria-label="유형 필터">'+['전체 유형',...types].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button id="stars" aria-pressed="'+onlyStar+'">'+(onlyStar?'★':'☆')+' 관심 의견</button></div>'+list.map(x=>'<article class="opinion"><div class="meta"><span class="tag">'+x.type+'</span><span>'+x.time+'</span><button class="star" aria-label="관심 의견 '+(x.star?'해제':'등록')+'" aria-pressed="'+x.star+'" onclick="toggle('+x.id+')">'+(x.star?'★':'☆')+'</button></div><p>'+esc(x.text)+'</p><small>'+esc(x.place||'위치 미입력')+'</small></article>').join('')+(!list.length?'<div class="empty">해당하는 의견이 없습니다.</div>':'')+'<div class="pager"><button disabled>이전</button><span>1 / 1</span><button disabled>다음</button></div><div class="note">★는 이 역 직원들이 함께 사용하는 관심 표시입니다.<br>채택이나 처리 완료를 의미하지 않습니다.<br>목록은 30일 이전 의견도 포함합니다.</div>';}
$('#app').innerHTML=html+'<div class="demo-notice">종로5가역 · 화면 검토용 예시 데이터</div>';
if(screen==='write'){$('#content').oninput=e=>{draft=e.target.value;$('#count').textContent=draft.length};$('#place').onchange=e=>place=e.target.value;$('#form').onsubmit=e=>{e.preventDefault();if(!draft.trim()){ $('#content').setCustomValidity('의견을 입력해 주세요.');$('#content').reportValidity();$('#content').oninput=e=>{e.target.setCustomValidity('');draft=e.target.value;$('#count').textContent=draft.length};return}items.unshift({id:Date.now(),type:category,place,text:draft.trim(),time:'방금 · 데모',star:false});total++;draft='';place='';go('done')}}
if(screen==='inbox'){$('#filter').onchange=e=>{filter=e.target.value;render()};$('#stars').onclick=()=>{onlyStar=!onlyStar;render()}}}
function choose(t){category=t;render()}function toggle(id){items.find(x=>x.id===id).star=!items.find(x=>x.id===id).star;render()}$('#screens').onchange=e=>go(e.target.value);$('#back').onclick=()=>go('entry');render();
</script></html>
