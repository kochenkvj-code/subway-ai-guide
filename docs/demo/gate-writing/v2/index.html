display:grid;gap:12px}.steps li{display:flex;gap:9px;font-size:14px;line-height:1.65;letter-spacing:-.3px}.steps b{font-weight:750}.steps .num{margin-top:1px}.note{background:#f4f7fa;border-radius:9px;padding:9px 10px;font-size:12px;line-height:1.65;color:#637b8e;margin:13px 0 0}.accordion{border:1px solid #dfe7ed;border-radius:9px;margin-top:11px}.accordion summary{padding:10px 11px;list-style:none;font-size:12px;font-weight:650;cursor:pointer;display:flex;justify-content:space-between;gap:6px}.accordion summary:after{content:'⌄';color:#8a9cad}.accordion[open] summary:after{content:'⌃'}.details{font-size:12px;line-height:1.7;color:#657e91;padding:0 11px 11px}.diagram{padding:0 9px 8px}.diagram svg{display:block;width:100%;height:auto}.caption{font-size:10px;line-height:1.5;color:#8a9cab;text-align:center;margin:4px 0}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:13px;padding-top:12px;border-top:1px solid #e5ecf1}.actions>button,.feedback button{border:1px solid #d7e5eb;background:#f1f7f9;border-radius:8px;padding:7px 2px;font-size:10px;letter-spacing:-.4px;line-height:1.45}.feedback{display:grid;gap:4px}.feedback button{padding:4px 2px}.feedback button[aria-pressed=true]{background:#e6f4ed;border-color:#8fbea7;color:#2e7054}.composer{display:flex;gap:8px;background:white;border-top:1px solid #e0e8ee;padding:10px 12px;flex-shrink:0}.composer input{flex:1;min-width:0;background:#f2f6f9;border:0;border-radius:9px;padding:12px 10px;font-size:12px;color:#39566e}.composer input::placeholder{color:#8a9ead}.composer button{background:#305777;color:white;border:0;border-radius:9px;padding:9px 12px;font-size:12px}.history{margin-top:12px;border-radius:12px;background:white;border:1px solid #e0e7ed;padding:12px;font-size:12px;line-height:1.7}.history p{margin:0}.history p+p{margin-top:8px}.toast{position:fixed;left:50%;bottom:77px;transform:translateX(-50%);background:#25445b;color:white;border-radius:10px;padding:11px 15px;font-size:12px;max-widt <div class="demo"><span>V2 · 게이트 오류 문구 개선 시안</span><span>한국어 · HTML 데모</span></div>
<main class="app" id="app"><header class="head"><button class="back" id="back" aria-label="뒤로가기">←</button><h1 id="heading">게이트 오류</h1><button class="home" id="home">홈</button><span class="language">한국어</span></header><section class="quick" id="quick" hidden><div class="quick-label">빠른 안내<small>● AI 안내 운영중</small></div><div class="quick-grid"><button data-other="길찾기"><b>↗</b>길찾기</button><button id="quick-gate"><b>↔</b>게이트 오류</button><button data-other="승차권·교통카드"><b>▣</b>승차권·교통카드</button><button data-other="시설안내"><b>♿</b>시설안내</button><button data-other="환전소 안내"><b>⇄</b>환전소 안내</button><button data-other="출구·관광지"><b>⌖</b>출구·관광지</button></div></section><div class="work" id="work"><div class="station"><span class="line">1</span>종로5가역</div><section class="card" id="menu"><p class="eyebrow">게이트에서 통과가 안 되나요?</p><h2>오류 코드를 선택하세요</h2><div class="intro"><p><span class="num">1</span><span><b>초록색 화살표</b>가 있는 게이트에<br>카드를 대세요.</span></p><p><span class="num">2</span><span><b>표시된 오류 코드</b>를 확인하고<br>아래에서 선택하세요.</span></p></div><div class="codes" id="codes"></div><button class="unknown" data-code="unknown"><span>코드를 모르겠어요</span><span>›</span></button><p class="help">안내대로 해도 통과할 수 없나요?<br>게이트의 <b>HELP 버튼</b>을 눌러 주세요.</p></section><section class="card" id="result" hidden></section><section class="history" id="history" hidden></section></div><form class="composer" id="composer"><input aria-label="질문" placeholder="궁금한 것을 입력하세요"><button>전송</button></form></main><div class="toast" id="toast" role="status" hidden></div><dialog id="office"><h2>고객안전실 위치</h2><p>실제 서비스에서는 기존 시설 안내의 고객안전실 위치 화면으로 연결합니다.</p><button id="close">닫기</button></dialog>
<script>
const $=s=>document.querySelector(s);let version='v2',selected=null,timer;const votes={};
const info={
e01:['카드 여러 장 인식','교통카드가 여러 장 인식됐습니다.',['사용할 <b>카드 한 장만 꺼내세요.</b>','초록색 화살표가 있는 게이트에 <b>카드를 다시 대세요.</b>'],'지갑이나 휴대폰 케이스 안의 카드가 함께 인식될 수 있습니다. 사용할 카드를 한 장만 분리해 주세요.'],
e03:['하차 기록 없음','교통카드에 <strong>하차 기록이 없습니다.</strong>',[],'하차할 때 카드가 정상적으로 인식되지 않았거나 하차 기록이 남지 않은 경우 표시될 수 있습니다.'],
e04:['승차 기록 없음','교통카드에 <strong>승차 기록이 없습니다.</strong>',[],'승차할 때 카드가 정상적으로 인식되지 않았거나 승차 기록이 남지 않은 경우 표시될 수 있습니다.'],
e05:['이용시간 초과','지하철 이용 가능 시간을 초과했습니다.',[],'지하철 이용 가능 시간을 초과한 경우 표시됩니다.'],
e06:['카드 사용 불가','현재 이 카드를 사용할 수 없습니다.',['사용할 수 있는 <b>다른 교통카드</b>가 있다면 이용해 보세요.','문제가 계속되면 <b>고객안전실</b>에 문의하세요.'],'카드 상태를 확인해야 할 수 있습니다. 오류가 계속되면 고객안전실에 문의해 주세요.'],
e14:['잔액 부족','교통카드의 <strong>잔액이 부족합니다.</strong>',['발매기·키오스크에서 <b>카드를 충전하세요.</b>','초록색 화살표가 있는 게이트에 <b>카드를 다시 대세요.</b>'],'카드 종류에 따라 충전할 수 있는 기기가 다를 수 있습니다.'],
e33:['이미 승차 처리됨','이미 승차 처리된 카드입니다.<br><strong>추가 정산할 필요가 없습니다.</strong>',[],'같은 역에서 이미 승차 처리된 카드를 다시 대면 표시됩니다.'],
e44:['이미 하차 처리됨','이미 하차 처리된 카드입니다.<br><strong>추가 정산할 필요가 없습니다.</strong>',[],'같은 역에서 이미 하차 처리된 카드를 다시 대면 표시됩니다.'],
opposite:['반대편 승강장','반대 방향의 열차를 타려면 이렇게 이동하세요.',[],'방향을 잘못 탔거나 목적지를 지나쳐 반대편 승강장으로 이동해야 할 때의 안내입니다.'],
unknown:['코드를 모르겠어요','코드가 보이지 않거나 목록에 없나요?',[],'고객안전실에서 교통카드 상태를 확인받을 수 있습니다.']};
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2300)}
function diagram(){return `<details class="accordion"><summary>넓은 게이트 위치 보기</summary><div class="diagram"><svg viewBox="0 0 320 130" role="img" aria-label="개찰구 끝에 있는 넓은 게이트 위치 예시"><rect width="320" height="130" rx="10" fill="#f0f6f9"/><rect x="185" y="15" width="124" height="104" rx="10" fill="#e1f3eb" stroke="#8dbca8" stroke-dasharray="4 3"/>${[17,58,99,140].map(x=>`<rect x="${x}" y="42" width="16" height="65" rx="4" fill="#9db0bd"/>`).join('')}<path d="M33 67h25v27H33zM74 67h25v27H74zM115 67h25v27h-25z" fill="#6e9bb2" opacity=".5"/><rect x="197" y="40" width="18" height="67" rx="4" fill="#739d9c"/><rect x="279" y="40" width="18" height="67" rx="4" fill="#739d9c"/><text x="247" y="76" text-anchor="middle" font-size="27" fill="#317b64">♿</text><path d="M247 113V91m-9 9 9-10 9 10" fill="none" stroke="#327d65" stroke-width="4" stroke-linecap="round"/><text x="91" y="27" text-anchor="middle" font-size="10" fill="#738b9d">일반 게이트</text><text x="247" y="29" text-anchor="middle" font-size="10" fill="#34765f" font-weight="700">넓은 게이트</text></svg><p class="caption">게이트 위치를 설명하는 예시 그림입니다.</p></div></details>`}
function render(){if(!selected){$('#menu').hidden=false;$('#result').hidden=true;return;}const x=info[selected],v2=version==='v2',id=selected;let steps=[...x[2]],note='';const locate='개찰구 끝의 <b>넓은 게이트<br>(휠체어 표시)</b>로 이동하세요.',pass='<b>삐 소리가 나더라도 통과하세요.</b>';
if(['e03','e04','e05'].includes(id)){steps=[locate];if(v2)steps.push(pass);steps.push(id==='e05'?'<b>통과 후 고객안전실에서<br>요금을 정산하세요.</b>':'<b>통과 후 고객안전실에서<br>카드 확인과 요금 정산</b>을 받으세요.');if(v2&&id!=='e04'){steps=[locate,pass];note='카드 확인이나 요금 정산이 필요한 경우 고객안전실을 방문해 주세요.';}if(v2&&id==='e04'){steps=[locate,pass,'통과 후 <b>고객안전실에서<br>카드 확인</b>을 받으세요.'];note='카드 확인 후 필요한 경우 요금을 정산하세요.';}}
if(['e33','e44'].includes(id))steps=[locate,v2?pass:'<b>넓은 게이트를 통과하세요.</b>'];if(id==='opposite')steps=[locate,v2?'삐 소리가 나더라도 통과해<br><b>반대편 승강장으로 이동하세요.</b>':'넓은 게이트를 통과해<br><b>반대편 승강장으로 이동하세요.</b>'];if(id==='unknown')steps=[locate,'통과 후 <b>고객안전실에서<br>교통카드를 확인받으세요.</b>'];if(id==='e14'&&v2)steps[0]='발매기·키오스크 또는 정산기에서<br><b>카드를 충전하세요.</b>';
let status=x[1];if(v2&&['e33','e44'].includes(id))status=status.replace('추가 정산할 필요가 없습니다.','다시 태그하거나 추가 정산할 필요가 없습니다.');
$('#menu').hidden=true;$('#result').hidden=false;$('#result').innerHTML=`<div class="result-title">${/^e/.test(id)?`<span class="badge">${id.replace('e','E-')}</span>`:''}<h2>${x[0]}</h2></div><p class="status">${status}</p><p class="label">이렇게 해보세요</p><ol class="steps">${steps.map((s,i)=>`<li><span class="num">${i+1}</span><span>${s}</span></li>`).join('')}</ol>${note?`<p class="note">${note}</p>`:''}${v2&&['e03','e04','e05','e33','e44','opposite','unknown'].includes(id)?diagram():''}<details class="accordion"><summary>오류 원인 보기</summary><div class="details">${x[3]}</div></details>${!v2&&id!=='unknown'?'<p class="help">안내대로 해도 통과할 수 없나요?<br>게이트의 <b>HELP 버튼</b>을 눌러 주세요.</p>':''}<div class="actions"><button id="another">← 오류 다시 선택</button><button id="office-button">고객안전실 위치</button><div class="feedback" role="group" aria-label="이 안내로 해결됐나요?"><button data-vote="yes" aria-pressed="${votes[version+id]==='yes'}">✓ 해결됨</button><button data-vote="no" aria-pressed="${votes[version+id]==='no'}">✕ 해결 안 됨</button></div></div>`;$('#another').onclick=()=>open(null);$('#office-button').onclick=()=>$('#office').showModal();document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{votes[version+id]=b.dataset.vote;document.querySelectorAll('[data-vote]').forEach(y=>y.setAttribute('aria-pressed',String(y===b)));toast('의견을 남겨주셔서 감사합니다.');});}
function updateUrl(push){const url=new URL(location);url.search='';if(selected)url.searchParams.set('code',selected);history[push?'pushState':'replaceState']({},'',url);}
function open(id,push=true){selected=id;render();$('#work').scrollTop=0;updateUrl(push);}
function setVersion(v,push=true){version=v;$('#app').classList.toggle('live',v==='live');$('#quick').hidden=v!=='live';$('#heading').textContent=v==='live'?'종로5가역 AI 안내':'게이트 오류';render();$('#work').scrollTop=0;updateUrl(push);}
$('#codes').innerHTML=Object.entries(info).filter(([id])=>id!=='unknown').map(([id,x])=>`<button data-code="${id}"><b>${id==='opposite'?'↔':id.replace('e','E-')}</b><span>${x[0]}</span></button>`).join('');document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>open(b.dataset.code));$('#back').onclick=()=>selected?open(null):toast('메인 화면으로 돌아가는 동작입니다.');$('#home').onclick=()=>{open(null);toast('메인 화면으로 돌아가는 동작입니다.');};$('#quick-gate').onclick=()=>open(null);document.querySelectorAll('[data-other]').forEach(b=>b.onclick=()=>toast(b.dataset.other+' 메뉴는 이번 시안에서 제외했습니다.'));$('#close').onclick=()=>$('#office').close();$('#composer').onsubmit=e=>{e.preventDefault();const input=$('#composer input');if(!input.value.trim())return;$('#history').hidden=false;const p=document.createElement('p');p.textContent='질문 · '+input.value;const q=document.createElement('p');q.textContent='시안에서는 AI 답변을 생성하지 않습니다. 오류 안내는 유지됩니다.';$('#history').append(p,q);input.value='';$('#history').scrollIntoView({block:'nearest'});};function restore(){const p=new URLSearchParams(location.search);version='v2';selected=info[p.get('code')]?p.get('code'):null;setVersion(version,false);}window.onpopstate=restore;restore();
</script></body></html>
